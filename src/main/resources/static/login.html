<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In — SpendWise</title>
    <meta name="description" content="Sign in to your SpendWise personal expense tracker account.">
    <script>
        (function() {
            try {
                const savedTheme = localStorage.getItem('spendwise_theme');
                const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
                const theme = savedTheme || (prefersDark ? 'dark' : 'light');
                document.documentElement.setAttribute('data-theme', theme);
            } catch(e) {}
        })();
    </script>
    <link rel="stylesheet" href="/css/styles.css?v=3.4.0">
</head>
<body class="auth-page">
    <!-- Top Navigation -->
    <header class="auth-top-nav">
        <a href="/login.html" class="brand brand-link" aria-label="SpendWise Home">
            <div class="brand-icon">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="12" y1="1" x2="12" y2="23"></line>
                    <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path>
                </svg>
            </div>
            <div>
                <h1 class="brand-name">SpendWise</h1>
                <span class="brand-tag">Expense Tracker</span>
            </div>
        </a>

        <div class="auth-nav-actions">
            <span class="auth-nav-hint">Don't have an account?</span>
            <a href="/register.html" class="btn btn-secondary btn-sm auth-nav-btn">Create Account</a>
            
            <!-- Light / Dark Theme Toggle Button -->
            <button class="theme-toggle-btn" id="themeToggleBtn" title="Toggle Light / Dark Mode" aria-label="Toggle light or dark theme">
                <svg class="sun-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="5"></circle>
                    <line x1="12" y1="1" x2="12" y2="3"></line>
                    <line x1="12" y1="21" x2="12" y2="23"></line>
                    <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                    <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                    <line x1="1" y1="12" x2="3" y2="12"></line>
                    <line x1="21" y1="12" x2="23" y2="12"></line>
                    <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                    <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                </svg>
                <svg class="moon-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                </svg>
            </button>
        </div>
    </header>

    <!-- Main Auth Center Content -->
    <main class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <div class="auth-badge">Sign In</div>
                <h2 class="auth-title">Welcome back</h2>
                <p class="auth-subtitle">Enter your credentials to access your personal dashboard.</p>
            </div>

            <!-- Alert Notification -->
            <div class="auth-alert hidden" id="authAlert" role="alert"></div>

            <!-- Login Form -->
            <form id="loginForm" class="auth-form" novalidate>
                <div class="form-group">
                    <label for="loginUsername">Username</label>
                    <div class="input-with-icon">
                        <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                            <circle cx="12" cy="7" r="4"></circle>
                        </svg>
                        <input type="text" id="loginUsername" class="form-control" placeholder="Enter username" required autocomplete="username" autofocus>
                    </div>
                </div>

                <div class="form-group">
                    <div class="form-label-row">
                        <label for="loginPassword">Password</label>
                    </div>
                    <div class="input-with-icon">
                        <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                        </svg>
                        <input type="password" id="loginPassword" class="form-control" placeholder="••••••••" required autocomplete="current-password">
                        <button type="button" class="btn-toggle-password" id="togglePasswordBtn" title="Show or hide password" aria-label="Toggle password visibility">
                            <svg class="eye-show" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                            <svg class="eye-hide hidden" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                                <line x1="1" y1="1" x2="23" y2="23"></line>
                            </svg>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary btn-block btn-lg" id="btnLoginSubmit">
                    <span>Sign In to Dashboard</span>
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                        <polyline points="12 5 19 12 12 19"></polyline>
                    </svg>
                </button>
            </form>

            <div class="auth-divider">
                <span>or</span>
            </div>

            <div class="auth-switch-box">
                <span>Don't have an account yet?</span>
                <a href="/register.html" class="auth-switch-link">Create an account &rarr;</a>
            </div>
        </div>
    </main>

    <script>
        // Check if user is already logged in -> redirect to dashboard
        (async function checkExistingAuth() {
            try {
                const res = await fetch('/api/auth/me');
                if (res.ok) {
                    const data = await res.json();
                    if (data && data.username) {
                        window.location.replace('/');
                    }
                }
            } catch(e) {}
        })();

        // Theme Toggle
        const themeToggleBtn = document.getElementById('themeToggleBtn');
        function initTheme() {
            const currentTheme = document.documentElement.getAttribute('data-theme') || 'dark';
            themeToggleBtn.setAttribute('title', currentTheme === 'dark' ? 'Switch to Light Mode' : 'Switch to Dark Mode');
        }
        themeToggleBtn.addEventListener('click', () => {
            const currentTheme = document.documentElement.getAttribute('data-theme') || 'dark';
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('spendwise_theme', newTheme);
            initTheme();
        });
        initTheme();

        // Password Visibility Toggle (Only 1 eye visible at all times)
        const togglePasswordBtn = document.getElementById('togglePasswordBtn');
        const loginPasswordInput = document.getElementById('loginPassword');
        const eyeShow = togglePasswordBtn.querySelector('.eye-show');
        const eyeHide = togglePasswordBtn.querySelector('.eye-hide');

        togglePasswordBtn.addEventListener('click', () => {
            const isPassword = loginPasswordInput.getAttribute('type') === 'password';
            if (isPassword) {
                loginPasswordInput.setAttribute('type', 'text');
                eyeShow.classList.add('hidden');
                eyeHide.classList.remove('hidden');
                togglePasswordBtn.setAttribute('title', 'Hide password');
            } else {
                loginPasswordInput.setAttribute('type', 'password');
                eyeShow.classList.remove('hidden');
                eyeHide.classList.add('hidden');
                togglePasswordBtn.setAttribute('title', 'Show password');
            }
        });

        // Alerts
        const authAlert = document.getElementById('authAlert');
        function showAlert(msg, isSuccess = false) {
            authAlert.textContent = msg;
            authAlert.className = 'auth-alert ' + (isSuccess ? 'auth-alert-success' : 'auth-alert-error');
            authAlert.classList.remove('hidden');
        }
        function hideAlert() {
            authAlert.classList.add('hidden');
            authAlert.textContent = '';
        }

        // Form Submit
        const loginForm = document.getElementById('loginForm');
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            hideAlert();
            const username = document.getElementById('loginUsername').value.trim();
            const password = document.getElementById('loginPassword').value;
            const submitBtn = document.getElementById('btnLoginSubmit');

            if (!username || !password) {
                showAlert('Please enter both your username and password.');
                return;
            }

            try {
                submitBtn.disabled = true;
                submitBtn.innerHTML = '<span>Signing in...</span>';

                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                if (response.ok) {
                    showAlert('Signed in successfully! Redirecting...', true);
                    setTimeout(() => {
                        window.location.replace('/');
                    }, 350);
                } else {
                    const errorData = await response.json().catch(() => ({}));
                    showAlert(errorData.message || 'Invalid username or password.');
                }
            } catch (err) {
                showAlert('Network error. Please make sure the server is reachable.');
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = `<span>Sign In to Dashboard</span>
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                        <polyline points="12 5 19 12 12 19"></polyline>
                    </svg>`;
            }
        });
    </script>
</body>
</html>
