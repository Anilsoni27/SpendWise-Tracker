<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpendWise — Account Access</title>
    <meta name="description" content="Sign in or create your personal SpendWise account to manage and track expenses.">
    <script>
        (function() {
            try {
                const savedTheme = localStorage.getItem('spendwise_theme');
                const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
                const theme = savedTheme || (prefersDark ? 'dark' : 'light');
                document.documentElement.setAttribute('data-theme', theme);
            } catch(e) {}
        })();
    </script>
    <link rel="stylesheet" href="/css/styles.css?v=3.6.0">
</head>
<body class="auth-page">
    <!-- Top Navigation -->
    <header class="auth-top-nav">
        <a href="/" class="brand-link" aria-label="SpendWise Home">
            <div class="brand-icon">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="12" y1="1" x2="12" y2="23"></line>
                    <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path>
                </svg>
            </div>
            <div>
                <h1 class="brand-name">SpendWise</h1>
                <span class="brand-tag">Expense Tracker</span>
            </div>
        </a>

        <!-- Light / Dark Theme Toggle Button -->
        <button class="theme-toggle-btn" id="themeToggleBtn" title="Toggle Light / Dark Mode" aria-label="Toggle light or dark theme">
            <svg class="sun-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="5"></circle>
                <line x1="12" y1="1" x2="12" y2="3"></line>
                <line x1="12" y1="21" x2="12" y2="23"></line>
                <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                <line x1="1" y1="12" x2="3" y2="12"></line>
                <line x1="21" y1="12" x2="23" y2="12"></line>
                <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
            </svg>
            <svg class="moon-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
        </button>
    </header>

    <!-- Main Auth Center Content -->
    <main class="auth-container">
        <!-- Single Unified Card for Sign In & Create Account -->
        <div class="auth-card">
            <div class="auth-header">
                <span class="auth-badge" id="authBadge">Account Access</span>
                
                <!-- Segmented Pill Switcher with Smooth Sliding Indicator -->
                <div class="auth-tabs" role="tablist" aria-label="Account Action">
                    <div class="auth-tab-indicator" id="tabIndicator"></div>
                    <button type="button" class="auth-tab active" id="tabSignIn" role="tab" aria-selected="true">Sign In</button>
                    <button type="button" class="auth-tab" id="tabCreateAccount" role="tab" aria-selected="false">Create Account</button>
                </div>

                <div class="auth-title-container" id="titleContainer">
                    <h2 class="auth-title" id="authHeading">Welcome back</h2>
                    <p class="auth-subtitle" id="authSubtitle">Enter your credentials to access your dashboard.</p>
                </div>
            </div>

            <!-- Alert Notification -->
            <div class="auth-alert hidden" id="authAlert" role="alert"></div>

            <!-- Form Container -->
            <div class="auth-form-container">
                <!-- Sign In Form -->
                <form id="signInForm" class="auth-form form-active" novalidate>
                    <div class="form-group">
                        <label for="loginUsername">Username</label>
                        <div class="input-with-icon">
                            <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                                <circle cx="12" cy="7" r="4"></circle>
                            </svg>
                            <input type="text" id="loginUsername" class="form-control" placeholder="Enter username" required autocomplete="username" autofocus>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="loginPassword">Password</label>
                        <div class="input-with-icon">
                            <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                            </svg>
                            <input type="password" id="loginPassword" class="form-control" placeholder="••••••••" required autocomplete="current-password">
                            <button type="button" class="btn-toggle-password" id="toggleLoginPasswordBtn" title="Show password" aria-label="Toggle password visibility">
                                <svg class="eye-show" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                    <circle cx="12" cy="12" r="3"></circle>
                                </svg>
                                <svg class="eye-hide hidden" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                                    <line x1="1" y1="1" x2="23" y2="23"></line>
                                </svg>
                            </button>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary btn-block btn-lg" id="btnSignInSubmit">
                        <span>Sign In to Dashboard</span>
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="5" y1="12" x2="19" y2="12"></line>
                            <polyline points="12 5 19 12 12 19"></polyline>
                        </svg>
                    </button>

                    <div class="auth-switch-box">
                        <span>Don't have an account?</span>
                        <button type="button" class="auth-switch-btn" id="linkToCreate">Create an account &rarr;</button>
                    </div>
                </form>

                <!-- Create Account Form -->
                <form id="createAccountForm" class="auth-form form-inactive hidden" novalidate>
                    <div class="form-group">
                        <label for="regFullName">Full Name</label>
                        <div class="input-with-icon">
                            <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                                <circle cx="12" cy="7" r="4"></circle>
                            </svg>
                            <input type="text" id="regFullName" class="form-control" placeholder="e.g. Anil Soni" required autocomplete="name">
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="regUsername">Choose Username</label>
                        <div class="input-with-icon">
                            <span class="input-prefix">@</span>
                            <input type="text" id="regUsername" class="form-control input-has-prefix" placeholder="username" required autocomplete="username">
                        </div>
                        <small class="form-hint">At least 3 characters (letters, numbers, underscores).</small>
                    </div>

                    <div class="form-group">
                        <label for="regPassword">Password</label>
                        <div class="input-with-icon">
                            <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                            </svg>
                            <input type="password" id="regPassword" class="form-control" placeholder="At least 6 characters" required minlength="6" autocomplete="new-password">
                            <button type="button" class="btn-toggle-password" id="toggleRegPasswordBtn" title="Show password" aria-label="Toggle password visibility">
                                <svg class="eye-show" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                    <circle cx="12" cy="12" r="3"></circle>
                                </svg>
                                <svg class="eye-hide hidden" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                                    <line x1="1" y1="1" x2="23" y2="23"></line>
                                </svg>
                            </button>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="regConfirmPassword">Confirm Password</label>
                        <div class="input-with-icon">
                            <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                                <polyline points="22 4 12 14.01 9 11.01"></polyline>
                            </svg>
                            <input type="password" id="regConfirmPassword" class="form-control" placeholder="Re-enter password" required autocomplete="new-password">
                            <button type="button" class="btn-toggle-password" id="toggleRegConfirmPasswordBtn" title="Show password" aria-label="Toggle password visibility">
                                <svg class="eye-show" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                    <circle cx="12" cy="12" r="3"></circle>
                                </svg>
                                <svg class="eye-hide hidden" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                                    <line x1="1" y1="1" x2="23" y2="23"></line>
                                </svg>
                            </button>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary btn-block btn-lg" id="btnRegisterSubmit">
                        <span>Create Account & Continue</span>
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="5" y1="12" x2="19" y2="12"></line>
                            <polyline points="12 5 19 12 12 19"></polyline>
                        </svg>
                    </button>

                    <div class="auth-switch-box">
                        <span>Already have an account?</span>
                        <button type="button" class="auth-switch-btn" id="linkToSignIn">Sign in here &rarr;</button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <script>
        // Check if user is already logged in -> redirect to dashboard
        (async function checkExistingAuth() {
            try {
                const res = await fetch('/api/auth/me');
                if (res.ok) {
                    const data = await res.json();
                    if (data && data.username) {
                        window.location.replace('/');
                    }
                }
            } catch(e) {}
        })();

        // Theme Toggle
        const themeToggleBtn = document.getElementById('themeToggleBtn');
        function initTheme() {
            const currentTheme = document.documentElement.getAttribute('data-theme') || 'dark';
            themeToggleBtn.setAttribute('title', currentTheme === 'dark' ? 'Switch to Light Mode' : 'Switch to Dark Mode');
        }
        themeToggleBtn.addEventListener('click', () => {
            const currentTheme = document.documentElement.getAttribute('data-theme') || 'dark';
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('spendwise_theme', newTheme);
            initTheme();
        });
        initTheme();

        // Elements
        const tabSignIn = document.getElementById('tabSignIn');
        const tabCreateAccount = document.getElementById('tabCreateAccount');
        const tabIndicator = document.getElementById('tabIndicator');
        const titleContainer = document.getElementById('titleContainer');
        const signInForm = document.getElementById('signInForm');
        const createAccountForm = document.getElementById('createAccountForm');
        const authHeading = document.getElementById('authHeading');
        const authSubtitle = document.getElementById('authSubtitle');
        const authBadge = document.getElementById('authBadge');
        const authAlert = document.getElementById('authAlert');

        let currentTab = 'signIn';

        function showAlert(msg, isSuccess = false) {
            authAlert.textContent = msg;
            authAlert.className = 'auth-alert ' + (isSuccess ? 'auth-alert-success' : 'auth-alert-error');
            authAlert.classList.remove('hidden');
        }
        function hideAlert() {
            authAlert.classList.add('hidden');
            authAlert.textContent = '';
        }

        // Switch Tab Functionality
        function switchToSignIn() {
            if (currentTab === 'signIn') return;
            currentTab = 'signIn';

            tabIndicator.style.transform = 'translateX(0%)';
            tabSignIn.classList.add('active');
            tabSignIn.setAttribute('aria-selected', 'true');
            tabCreateAccount.classList.remove('active');
            tabCreateAccount.setAttribute('aria-selected', 'false');

            signInForm.classList.remove('hidden', 'form-inactive');
            signInForm.classList.add('form-active');
            createAccountForm.classList.add('hidden', 'form-inactive');
            createAccountForm.classList.remove('form-active');

            // Smooth subtle title cross-fade
            titleContainer.style.opacity = '0';
            setTimeout(() => {
                authBadge.textContent = 'Account Access';
                authHeading.textContent = 'Welcome back';
                authSubtitle.textContent = 'Enter your credentials to access your dashboard.';
                titleContainer.style.opacity = '1';
            }, 120);

            hideAlert();
            document.getElementById('loginUsername').focus();
            if (history.replaceState) history.replaceState(null, '', '/login.html');
        }

        function switchToCreateAccount() {
            if (currentTab === 'create') return;
            currentTab = 'create';

            tabIndicator.style.transform = 'translateX(100%)';
            tabCreateAccount.classList.add('active');
            tabCreateAccount.setAttribute('aria-selected', 'true');
            tabSignIn.classList.remove('active');
            tabSignIn.setAttribute('aria-selected', 'false');

            createAccountForm.classList.remove('hidden', 'form-inactive');
            createAccountForm.classList.add('form-active');
            signInForm.classList.add('hidden', 'form-inactive');
            signInForm.classList.remove('form-active');

            // Smooth subtle title cross-fade
            titleContainer.style.opacity = '0';
            setTimeout(() => {
                authBadge.textContent = 'Create Account';
                authHeading.textContent = 'Create your account';
                authSubtitle.textContent = 'Start tracking your personal expenses privately.';
                titleContainer.style.opacity = '1';
            }, 120);

            hideAlert();
            document.getElementById('regFullName').focus();
            if (history.replaceState) history.replaceState(null, '', '/login.html#register');
        }

        tabSignIn.addEventListener('click', switchToSignIn);
        tabCreateAccount.addEventListener('click', switchToCreateAccount);
        document.getElementById('linkToCreate').addEventListener('click', switchToCreateAccount);
        document.getElementById('linkToSignIn').addEventListener('click', switchToSignIn);

        // Check URL hash or query param on load
        window.addEventListener('load', () => {
            if (window.location.hash === '#register' || window.location.search.includes('tab=register')) {
                switchToCreateAccount();
            }
        });

        // Single Eye Password Toggle Helper (strictly 1 eye visible)
        function setupPasswordToggle(btnId, inputId) {
            const toggleBtn = document.getElementById(btnId);
            const input = document.getElementById(inputId);
            if (!toggleBtn || !input) return;

            const eyeShow = toggleBtn.querySelector('.eye-show');
            const eyeHide = toggleBtn.querySelector('.eye-hide');

            toggleBtn.addEventListener('click', () => {
                const isPassword = input.getAttribute('type') === 'password';
                if (isPassword) {
                    input.setAttribute('type', 'text');
                    eyeShow.classList.add('hidden');
                    eyeHide.classList.remove('hidden');
                    toggleBtn.setAttribute('title', 'Hide password');
                } else {
                    input.setAttribute('type', 'password');
                    eyeShow.classList.remove('hidden');
                    eyeHide.classList.add('hidden');
                    toggleBtn.setAttribute('title', 'Show password');
                }
            });
        }

        setupPasswordToggle('toggleLoginPasswordBtn', 'loginPassword');
        setupPasswordToggle('toggleRegPasswordBtn', 'regPassword');
        setupPasswordToggle('toggleRegConfirmPasswordBtn', 'regConfirmPassword');

        // Handle Sign In Submit
        signInForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            hideAlert();
            const username = document.getElementById('loginUsername').value.trim();
            const password = document.getElementById('loginPassword').value;
            const submitBtn = document.getElementById('btnSignInSubmit');

            if (!username || !password) {
                showAlert('Please enter both your username and password.');
                return;
            }

            try {
                submitBtn.disabled = true;
                submitBtn.innerHTML = '<span>Signing in...</span>';

                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                if (response.ok) {
                    showAlert('Signed in successfully! Redirecting...', true);
                    setTimeout(() => {
                        window.location.replace('/');
                    }, 350);
                } else {
                    const errorData = await response.json().catch(() => ({}));
                    showAlert(errorData.message || 'Invalid username or password.');
                }
            } catch (err) {
                showAlert('Network error. Please make sure the server is reachable.');
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = `<span>Sign In to Dashboard</span>
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                        <polyline points="12 5 19 12 12 19"></polyline>
                    </svg>`;
            }
        });

        // Handle Create Account Submit
        createAccountForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            hideAlert();

            const fullName = document.getElementById('regFullName').value.trim();
            const username = document.getElementById('regUsername').value.trim();
            const password = document.getElementById('regPassword').value;
            const confirmPassword = document.getElementById('regConfirmPassword').value;
            const submitBtn = document.getElementById('btnRegisterSubmit');

            if (!fullName || !username || !password || !confirmPassword) {
                showAlert('Please fill in all the required fields.');
                return;
            }

            if (username.length < 3) {
                showAlert('Username must be at least 3 characters.');
                return;
            }

            if (password.length < 6) {
                showAlert('Password must be at least 6 characters.');
                return;
            }

            if (password !== confirmPassword) {
                showAlert('Passwords do not match. Please re-enter.');
                return;
            }

            try {
                submitBtn.disabled = true;
                submitBtn.innerHTML = '<span>Creating Account...</span>';

                const response = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ fullName, username, password })
                });

                if (response.ok) {
                    showAlert('Account created successfully! Preparing dashboard...', true);
                    setTimeout(() => {
                        window.location.replace('/');
                    }, 400);
                } else {
                    const errorData = await response.json().catch(() => ({}));
                    showAlert(errorData.message || 'Registration failed. Please check inputs.');
                }
            } catch (err) {
                showAlert('Network error. Please make sure the server is reachable.');
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = `<span>Create Account & Continue</span>
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                        <polyline points="12 5 19 12 12 19"></polyline>
                    </svg>`;
            }
        });
    </script>
</body>
</html>
