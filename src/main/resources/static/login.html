<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpendWise — Sign In</title>
    <meta name="description" content="Sign in or create an account for SpendWise Expense Tracker.">
    <script>
        (function() {
            try {
                const savedTheme = localStorage.getItem('spendwise_theme');
                const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
                const theme = savedTheme || (prefersDark ? 'dark' : 'light');
                document.documentElement.setAttribute('data-theme', theme);
            } catch(e) {}
        })();
    </script>
    <link rel="stylesheet" href="/css/styles.css?v=3.3.0">
</head>
<body class="auth-page">
    <div class="auth-top-nav">
        <div class="brand">
            <div class="brand-icon">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="12" y1="1" x2="12" y2="23"></line>
                    <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path>
                </svg>
            </div>
            <div>
                <h1 class="brand-name">SpendWise</h1>
                <span class="brand-tag">Expense Tracker</span>
            </div>
        </div>

        <!-- Light / Dark Theme Toggle Button -->
        <button class="theme-toggle-btn" id="themeToggleBtn" title="Toggle Light / Dark Mode" aria-label="Toggle light or dark theme">
            <svg class="sun-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="5"></circle>
                <line x1="12" y1="1" x2="12" y2="3"></line>
                <line x1="12" y1="21" x2="12" y2="23"></line>
                <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                <line x1="1" y1="12" x2="3" y2="12"></line>
                <line x1="21" y1="12" x2="23" y2="12"></line>
                <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
            </svg>
            <svg class="moon-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
        </button>
    </div>

    <main class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <div class="auth-badge">Secure Access</div>
                <h2 class="auth-title" id="authTitle">Welcome Back</h2>
                <p class="auth-subtitle" id="authSubtitle">Manage your finances and track daily expenses smartly.</p>
            </div>

            <!-- Tab Switcher -->
            <div class="auth-tabs" role="tablist">
                <button type="button" class="auth-tab active" id="tabLogin" role="tab" aria-selected="true">Sign In</button>
                <button type="button" class="auth-tab" id="tabRegister" role="tab" aria-selected="false">Create Account</button>
            </div>

            <!-- Alert Notification -->
            <div class="auth-alert hidden" id="authAlert" role="alert"></div>

            <!-- Login Form -->
            <form id="loginForm" class="auth-form" novalidate>
                <div class="form-group">
                    <label for="loginUsername">Username</label>
                    <input type="text" id="loginUsername" class="form-control" placeholder="e.g. demo" required autocomplete="username" autofocus>
                </div>

                <div class="form-group">
                    <label for="loginPassword">Password</label>
                    <input type="password" id="loginPassword" class="form-control" placeholder="••••••••" required autocomplete="current-password">
                </div>

                <button type="submit" class="btn btn-primary btn-block btn-lg" id="btnLoginSubmit">
                    <span>Sign In</span>
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                        <polyline points="12 5 19 12 12 19"></polyline>
                    </svg>
                </button>

                <div class="demo-box">
                    <div class="demo-box-header">
                        <span class="demo-badge">Quick Demo</span>
                        <button type="button" class="demo-fill-btn" id="btnFillDemo">Autofill Demo Login</button>
                    </div>
                    <div class="demo-credentials">
                        <span>Username: <code>demo</code></span>
                        <span>Password: <code>password123</code></span>
                    </div>
                </div>
            </form>

            <!-- Register Form -->
            <form id="registerForm" class="auth-form hidden" novalidate>
                <div class="form-group">
                    <label for="regFullName">Full Name</label>
                    <input type="text" id="regFullName" class="form-control" placeholder="e.g. Anil Soni" required autocomplete="name">
                </div>

                <div class="form-group">
                    <label for="regUsername">Username</label>
                    <input type="text" id="regUsername" class="form-control" placeholder="e.g. anilsoni" required autocomplete="username">
                    <small class="form-hint">At least 3 characters. Letters, numbers, and dots.</small>
                </div>

                <div class="form-group">
                    <label for="regPassword">Password</label>
                    <input type="password" id="regPassword" class="form-control" placeholder="••••••••" required minlength="6" autocomplete="new-password">
                    <small class="form-hint">Must be at least 6 characters long.</small>
                </div>

                <button type="submit" class="btn btn-primary btn-block btn-lg" id="btnRegisterSubmit">
                    <span>Create Account & Continue</span>
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                        <polyline points="12 5 19 12 12 19"></polyline>
                    </svg>
                </button>
            </form>
        </div>
    </main>

    <script>
        // Check if user is already logged in
        (async function checkExistingAuth() {
            try {
                const res = await fetch('/api/auth/me');
                if (res.ok) {
                    const data = await res.json();
                    if (data && data.username) {
                        window.location.replace('/');
                    }
                }
            } catch(e) {}
        })();

        // Theme Toggle
        const themeToggleBtn = document.getElementById('themeToggleBtn');
        function initTheme() {
            const currentTheme = document.documentElement.getAttribute('data-theme') || 'dark';
            themeToggleBtn.setAttribute('title', currentTheme === 'dark' ? 'Switch to Light Mode' : 'Switch to Dark Mode');
        }
        themeToggleBtn.addEventListener('click', () => {
            const currentTheme = document.documentElement.getAttribute('data-theme') || 'dark';
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('spendwise_theme', newTheme);
            initTheme();
        });
        initTheme();

        // Tabs Toggle
        const tabLogin = document.getElementById('tabLogin');
        const tabRegister = document.getElementById('tabRegister');
        const loginForm = document.getElementById('loginForm');
        const registerForm = document.getElementById('registerForm');
        const authTitle = document.getElementById('authTitle');
        const authSubtitle = document.getElementById('authSubtitle');
        const authAlert = document.getElementById('authAlert');

        function showAlert(msg, isSuccess = false) {
            authAlert.textContent = msg;
            authAlert.className = 'auth-alert ' + (isSuccess ? 'auth-alert-success' : 'auth-alert-error');
            authAlert.classList.remove('hidden');
        }

        function hideAlert() {
            authAlert.classList.add('hidden');
            authAlert.textContent = '';
        }

        tabLogin.addEventListener('click', () => {
            tabLogin.classList.add('active');
            tabLogin.setAttribute('aria-selected', 'true');
            tabRegister.classList.remove('active');
            tabRegister.setAttribute('aria-selected', 'false');
            loginForm.classList.remove('hidden');
            registerForm.classList.add('hidden');
            authTitle.textContent = 'Welcome Back';
            authSubtitle.textContent = 'Manage your finances and track daily expenses smartly.';
            hideAlert();
            document.getElementById('loginUsername').focus();
        });

        tabRegister.addEventListener('click', () => {
            tabRegister.classList.add('active');
            tabRegister.setAttribute('aria-selected', 'true');
            tabLogin.classList.remove('active');
            tabLogin.setAttribute('aria-selected', 'false');
            registerForm.classList.remove('hidden');
            loginForm.classList.add('hidden');
            authTitle.textContent = 'Create Account';
            authSubtitle.textContent = 'Start tracking your spending with a private personal account.';
            hideAlert();
            document.getElementById('regFullName').focus();
        });

        // Quick Autofill Demo
        document.getElementById('btnFillDemo').addEventListener('click', () => {
            document.getElementById('loginUsername').value = 'demo';
            document.getElementById('loginPassword').value = 'password123';
            hideAlert();
        });

        // Submit Login
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            hideAlert();
            const username = document.getElementById('loginUsername').value.trim();
            const password = document.getElementById('loginPassword').value;
            const submitBtn = document.getElementById('btnLoginSubmit');

            if (!username || !password) {
                showAlert('Please enter both username and password.');
                return;
            }

            try {
                submitBtn.disabled = true;
                submitBtn.innerHTML = '<span>Signing in...</span>';

                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                if (response.ok) {
                    showAlert('Signed in successfully! Redirecting...', true);
                    setTimeout(() => {
                        window.location.replace('/');
                    }, 400);
                } else {
                    const errorData = await response.json().catch(() => ({}));
                    showAlert(errorData.message || 'Invalid username or password.');
                }
            } catch (err) {
                showAlert('Network error. Please make sure the server is running.');
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = `<span>Sign In</span>
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                        <polyline points="12 5 19 12 12 19"></polyline>
                    </svg>`;
            }
        });

        // Submit Register
        registerForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            hideAlert();
            const fullName = document.getElementById('regFullName').value.trim();
            const username = document.getElementById('regUsername').value.trim();
            const password = document.getElementById('regPassword').value;
            const submitBtn = document.getElementById('btnRegisterSubmit');

            if (!fullName || !username || !password) {
                showAlert('Please fill in all fields.');
                return;
            }

            if (username.length < 3) {
                showAlert('Username must be at least 3 characters.');
                return;
            }

            if (password.length < 6) {
                showAlert('Password must be at least 6 characters.');
                return;
            }

            try {
                submitBtn.disabled = true;
                submitBtn.innerHTML = '<span>Creating Account...</span>';

                const response = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ fullName, username, password })
                });

                if (response.ok) {
                    showAlert('Account created successfully! Redirecting...', true);
                    setTimeout(() => {
                        window.location.replace('/');
                    }, 400);
                } else {
                    const errorData = await response.json().catch(() => ({}));
                    showAlert(errorData.message || 'Registration failed. Please check inputs.');
                }
            } catch (err) {
                showAlert('Network error. Please make sure the server is running.');
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = `<span>Create Account & Continue</span>
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                        <polyline points="12 5 19 12 12 19"></polyline>
                    </svg>`;
            }
        });
    </script>
</body>
</html>
